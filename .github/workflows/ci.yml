# 每次 push / PR 都跑一次驗證：規則單元測試 + 真的開伺服器打一場線上對戰。
name: 測試

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 規則與線上流程
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: 規則單元測試
        run: node tests/verify.js
      - name: 線上流程實測（開伺服器、多人搶打、觀戰、邀請、斷線重連）
        run: node scripts/online-check.js
